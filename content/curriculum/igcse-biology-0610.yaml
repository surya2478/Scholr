    objectives:
      - { code: "16.1", statement: "Asexual reproduction" }
      - { code: "16.2", statement: "Sexual reproduction" }
      - { code: "16.3", statement: "Sexual reproduction in plants" }
      - { code: "16.4", statement: "Sexual reproduction in humans" }
