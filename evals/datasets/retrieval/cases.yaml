# Retrieval benchmark (AC-K2): recall@8 of the expected objective and agreement of the retrieval state.
# Questions are written for this benchmark in a student's words (not copied from any textbook or paper).
# expected_objective: objective code from content/curriculum/*.yaml. expected_state: the state a well-grounded
# system should reach — HIGH/MEDIUM when the course textbook covers it; NONE when it is off-syllabus.
# Changing this file => bump version and re-run app.jobs.retrieval_eval.
version: retrieval_v1
cases:
