          - { code: "1.4", statement: Prime numbers, page: 15 }
          - { code: "1.5", statement: Prime factorisation, page: 16 }
          - { code: "1.6", statement: More about HCF and LCM, page: 18 }
          - { code: "1.7", statement: Real numbers, page: 20 }
      - code: ch02
        name: Fractions and percentages
        objectives:
          - { code: "2.1", statement: Equivalent fractions, page: 24 }
          - { code: "2.2", statement: Fractions and decimals, page: 26 }
          - { code: "2.3", statement: Recurring decimals, tier: extended, page: 27 }
          - { code: "2.4", statement: "Percentages, fractions and decimals", page: 30 }
          - { code: "2.5", statement: Calculating a percentage, page: 34 }
          - { code: "2.6", statement: Increasing or decreasing quantities by a percentage, page: 36 }
          - { code: "2.7", statement: One quantity as a percentage of another, page: 40 }
          - { code: "2.8", statement: Simple interest and compound interest, page: 43 }
          - { code: "2.9", statement: A formula for compound interest, page: 45 }
          - { code: "2.10", statement: Reverse percentage, tier: extended, page: 47 }
      - code: ch03
        name: The four rules
        objectives:
          - { code: "3.1", statement: Order of operations, page: 52 }
          - { code: "3.2", statement: Choosing the correct operation, page: 54 }
