# Curriculum structure — Cambridge IGCSE Biology 0610
#
# Provenance: the official Cambridge IGCSE Biology 0610 syllabus for 2026, 2027 and 2028
# (subjects/IGCSE/Biology), read 16 Sep 2026. Topic and subtopic codes and titles are extracted from the
# syllabus's own subject-content section, not transcribed by hand. The assessment overview below is from the
# same document. Term 1 coverage — topics 1, 2, 3, 4 and 19 — is from the school's "Year 10 Topic Planner for Term 1
# (September - December 2026)", given by the parent.
#
# Scholr does not teach this subject yet: subject_configs/igcse_biology_0610.yaml sets `stage: planned`, so there is no
# question bank, retrieval corpus or marking behind it. The syllabus is verified, which is what a subject
# needs before it can move to `stage: taught`; the rest of the engine is the Physics/Chemistry slice in
# docs/ROADMAP.md. Today these rows name the IGCSE ground under an IIT Foundation class (docs/PHASE-3.md).

curriculum: { code: CAIE-IGCSE, name: Cambridge IGCSE }
path: { code: IGCSE, name: IGCSE }
syllabus:
  code: "0610"
  title: Cambridge IGCSE Biology
  version: "for-2028-exam"
  tiers: [core, extended]
  first_exam_year: 2026
  last_exam_year: 2028
  verification_status: verified
  source_note: >-
    Verified 16 Sep 2026 against the official 0610 syllabus for 2026-2028: 21 topics and
    61 subtopics, with the Extended assessment overview (Papers 2, 4 and 6). Term 1 coverage
    from the school's Year 10 Term 1 planner.
# `pages`: printed pages of the coursebook (Cambridge IGCSE Biology Coursebook) where each objective starts, from
# its contents pages and, where two objectives share a section, the section's own headings in the OCR text
# (22 Sep 2026). A chunk belongs to the objective whose start page last precedes it (knowledge.chunking). 15.1
# (Drugs) has no section in this book — only "antibiotic resistance" inside selection — so it has no pages.
subject: { code: igcse-biology, name: Biology, config_key: igcse_biology_0610 }

# Extended route. All three sciences share this structure in the 2026-2028 syllabuses.
components:
  - code: "P2"
    name: Paper 2 — Multiple Choice (Extended)
    tier: extended
    duration_min: 45
    marks: 40
    structure_note: 40 four-option multiple-choice questions; 30% of the qualification.
  - code: "P4"
    name: Paper 4 — Theory (Extended)
    tier: extended
    duration_min: 75
    marks: 80
    structure_note: Short-answer and structured questions; 50% of the qualification.
  - code: "P6"
    name: Paper 6 — Alternative to Practical
    duration_min: 60
    marks: 40
    structure_note: >-
      Questions based on the experimental skills in section 4 of the syllabus; 20% of the qualification. The
      alternative is Paper 5 (Practical Test, 1 h 15 min, 40 marks) — the school's planner lists Paper 6.

skills:
  - { code: AO1, name: "Knowledge with understanding" }
  - { code: AO2, name: "Handling information and problem-solving" }
  - { code: AO3, name: "Experimental skills and investigations" }

topics:
  - code: "1"
    name: "Characteristics and classification of living organisms"
    objectives:
      - { code: "1.1", statement: "Characteristics of living organisms", pages: [3] }   # Term 1
      - { code: "1.2", statement: "Concept and uses of classification systems", pages: [5, 7] }   # Term 1
      - { code: "1.3", statement: "Features of organisms", pages: [10, 15, 24] }   # Term 1
  - code: "2"
    name: "Organisation of the organism"
    objectives:
      - { code: "2.1", statement: "Cell structure", pages: [33, 40, 41] }   # Term 1
      - { code: "2.2", statement: "Size of specimens", pages: [42] }   # Term 1
  - code: "3"
    name: "Movement into and out of cells"
    objectives:
      - { code: "3.1", statement: "Diffusion", pages: [51] }   # Term 1
      - { code: "3.2", statement: "Osmosis", pages: [55] }   # Term 1
      - { code: "3.3", statement: "Active transport", pages: [61] }   # Term 1
  - code: "4"
    name: "Biological molecules"
    objectives:
      - { code: "4.1", statement: "Biological molecules", pages: [70, 77] }   # Term 1
  - code: "5"
    name: "Enzymes"
    objectives:
      - { code: "5.1", statement: "Enzymes", pages: [84] }
  - code: "6"
    name: "Plant nutrition"
    objectives:
      - { code: "6.1", statement: "Photosynthesis", pages: [99, 107] }
      - { code: "6.2", statement: "Leaf structure", pages: [103] }
  - code: "7"
    name: "Human nutrition"
    objectives:
      - { code: "7.1", statement: "Diet", pages: [128] }
      - { code: "7.2", statement: "Digestive system", pages: [132] }
      - { code: "7.3", statement: "Physical digestion", pages: [136] }
      - { code: "7.4", statement: "Chemical digestion", pages: [138] }
      - { code: "7.5", statement: "Absorption", pages: [140] }
  - code: "8"
    name: "Transport in plants"
    objectives:
      - { code: "8.1", statement: "Xylem and phloem", pages: [149] }
      - { code: "8.2", statement: "Water uptake", pages: [152] }
      - { code: "8.3", statement: "Transpiration", pages: [154] }
