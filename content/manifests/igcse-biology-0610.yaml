# Source manifest — Cambridge IGCSE Biology 0610
# Raw files live in subjects/ (gitignored). Private study use for one student; never redistributed.
#
# The course book is not ingested — see igcse-physics-0625.yaml. Like the Chemistry book it has NO TEXT LAYER (it is a
# scan), so every page would need vision OCR. Get a cost estimate and the parent's agreement first; at 478
# pages it is the largest of the three books.
subject: igcse-biology
curriculum: CAIE-IGCSE
syllabus: "0610"

sources:
  - key: igcse-biology-textbook
    title: "IGCSE Biology Textbook"
    publisher: Cambridge University Press
    edition: "2001"
    owner: Cambridge University Press & Assessment
    licence: >-
      Copyrighted textbook; family's copy used for the student's private study only. Stored privately;
      short excerpts with page references only; never redistributed.
    acquired_via: Provided by parent (subjects/IGCSE/Biology), 16 Sep 2026; school course textbook
    private: true
    file: IGCSE/Biology/747041263-9th-IGCSE-Biology-TextBook-PDF.pdf
    authority_tier: B
    content_kind: explanation
    # Scan settings (22 Sep 2026): those screened on the Collins Maths book (evals/reports/ocr_collins-*), which
    # keep equations, subscripts and units as LaTeX. Flash-Lite, live: the Batch API takes no inline page images.
    ocr_role: page_ocr_math
    ocr_prompt: page_ocr_math_md
    ocr_output: markdown
    ocr_dpi: 220
    ocr_postprocess: [unicode_math_to_latex]
    notes: >-
      478 pages, 217 MB, scanned: no text layer, so neither the title page nor the contents could be read
      without vision OCR. Publisher and edition were first given as a 2001 edition (U19, 16 Sep 2026), but the
      OCR of 22 Sep 2026 shows the current "Cambridge IGCSE Biology Coursebook" (its companion workbook is the
      4th edition, Mary Jones & Geoff Jones), whose chapters follow the 0610 syllabus closely. Still explanation
      only: the syllabus remains the authority on what is examinable. Screen OCR settings with app.jobs.ocr_eval, and price the full
      run, before ingesting.

  - key: 0610-syllabus-2026-2028
    title: "Cambridge IGCSE Biology 0610 syllabus for 2026, 2027 and 2028"
    publisher: Cambridge University Press & Assessment (UCLES)
    owner: Cambridge University Press & Assessment
    licence: >-
      Copyright UCLES. Published syllabus, obtained for the student's private study. Stored privately;
      excerpts shown only in short form with references; not redistributed.
    acquired_via: Provided by parent (subjects/IGCSE/Biology), 16 Sep 2026
    private: true
    file: IGCSE/Biology/697203-2026-2028-syllabus-Biology.pdf
    authority_tier: A
    content_kind: syllabus
    notes: >-
      The authority for the 0610 curriculum file. Its subject-content section was parsed on 16 Sep 2026 to
      build content/curriculum/igcse-biology-0610.yaml, which is now `verified`.
