# Curriculum structure — Cambridge IGCSE Sociology 0495
#
# Provenance: Official Cambridge IGCSE Sociology 0495 syllabus for 2025, 2026 and 2027
# (Section 3: Subject Content, pages 12-30). Structured constructively into Units (depth 0),
# Chapters (depth 1), and bite-sized syllabus sub-topic objectives with textbook start pages.

curriculum: { code: CAIE-IGCSE, name: Cambridge IGCSE }
path: { code: IGCSE, name: IGCSE }
syllabus:
  code: "0495"
  title: Cambridge IGCSE Sociology
  version: "for-2027-exam"
  tiers: []
  verification_status: verified
  source_note: >-
    Constructive structure extracted from official 0495 syllabus for 2025–2027 (Section 3: Subject content, pages 12–30).
subject: { code: igcse-sociology, name: Sociology, config_key: igcse_sociology_0495 }

components:
  - code: "P1"
    name: "Paper 1 — Research Methods, Identity and Inequality"
    duration_min: 120
    marks: 80
    structure_note: >-
      Two structured questions: Question 1 Research methods (compulsory, includes data response), then either
      Question 2 or Question 3. 50% of the qualification.
  - code: "P2"
    name: "Paper 2 — Family, Education and Crime"
    duration_min: 105
    marks: 80
    structure_note: Two optional structured questions from a choice of three. 50% of the qualification.

skills:
  - { code: AO1, name: "Knowledge and understanding" }
  - { code: AO2, name: "Interpretation and application" }
  - { code: AO3, name: "Analysis and evaluation" }

topics:
  - code: U1
    name: "Research methods"
    children:
      - code: "ch1.1"
        name: "How do sociologists approach the study of society?"
        objectives:
          - code: "1.1.1"
            statement: "The positivist approach: scientific method, macro view, social facts, quantitative data, causation and correlation, patterns and trends, objectivity and reliability"
            syllabus_ref: "1.1.1"
            page: 2
          - code: "1.1.2"
            statement: "The interpretivist approach: micro view, meanings and motivations, qualitative data, in-depth study, subjectivity, validity and verstehen"
            syllabus_ref: "1.1.2"
            page: 4
          - code: "1.1.3"
            statement: "Approaches that combine different research methods and evidence: triangulation and longitudinal studies"
            syllabus_ref: "1.1.3"
            page: 5
          - code: "1.1.4"
            statement: "The analysis and evaluation of research choices: bias, interviewer effect, Hawthorne/observer effect, validity, reliability, representativeness and generalisability"
            syllabus_ref: "1.1.4"
            page: 7
      - code: "ch1.2"
        name: "What types of data and evidence do sociologists use?"
        objectives:
          - code: "1.2.1"
            statement: "Sources of data: primary vs secondary sources, qualitative vs quantitative data, strengths and limitations"
            syllabus_ref: "1.2.1"
            page: 10
          - code: "1.2.2"
            statement: "Secondary evidence: official statistics, historical and personal documents, digital sources, media content"
            syllabus_ref: "1.2.2"
            page: 12
          - code: "1.2.3"
            statement: "Analysis, interpretation and evaluation of data from qualitative and quantitative sources: summaries of studies, diagrams, tables, charts, graphs"
            syllabus_ref: "1.2.3"
            page: 17
      - code: "ch1.3"
        name: "How do sociologists investigate society?"
        objectives:
          - code: "1.3.1"
            statement: "The stages in research design: selection of topic, aims, hypothesis, target population, methods, operationalisation, pilot studies"
            syllabus_ref: "1.3.1"
            page: 20
          - code: "1.3.2"
            statement: "Sampling frames and techniques: random, systematic, stratified, snowball, quota sampling"
            syllabus_ref: "1.3.2"
            page: 22
          - code: "1.3.3"
            statement: "Quantitative and qualitative primary research methods: surveys, questionnaires, interviews, observations"
            syllabus_ref: "1.3.3"
            page: 26
          - code: "1.3.4"
            statement: "Types of question: open, closed, multiple choice, scaled"
            syllabus_ref: "1.3.4"
            page: 35
          - code: "1.3.5"
            statement: "Theoretical and practical issues affecting research: researcher perspective, access, response rate, funding/cost, time"
            syllabus_ref: "1.3.5"
            page: 36
          - code: "1.3.6"
            statement: "Ethical issues affecting research: informed consent, privacy/confidentiality, deception, prevention of harm, legality"
            syllabus_ref: "1.3.6"
            page: 38

  - code: U2
    name: "Identity: self and society"
    children:
      - code: "ch2.1"
        name: "How do we learn our identity?"
        objectives:
          - code: "2.1.1"
            statement: "Society as a social construction: culture, norms, values, customs, roles, status (achieved/ascribed), stereotypes"
            syllabus_ref: "2.1.1"
            page: 44
          - code: "2.1.2"
            statement: "The social construction of our identity: nature-nurture debate, relativity of culture, socialisation, norms and values"
            syllabus_ref: "2.1.2"
            page: 48
          - code: "2.1.3"
            statement: "Primary and secondary socialisation: key agencies (family, education, peer group, media, religion, workplace) and their effectiveness"
            syllabus_ref: "2.1.3"
            page: 51
          - code: "2.1.4"
            statement: "Processes used by agencies of socialisation: canalisation, hidden curriculum, media representations, peer pressure, religious teachings, role modelling, workplace training"
            syllabus_ref: "2.1.4"
            page: 54
          - code: "2.1.5"
            statement: "The debate between sociological perspectives and theories on socialisation: Functionalism, Marxism, Feminism, Interactionism"
            syllabus_ref: "2.1.5"
            page: 58
      - code: "ch2.2"
        name: "How does society control us?"
        objectives:
          - code: "2.2.1"
            statement: "Social control: formal and informal social control, sanctions and social conformity"
            syllabus_ref: "2.2.1"
            page: 60
          - code: "2.2.2"
            statement: "The debate between consensus and conflict views of social control"
            syllabus_ref: "2.2.2"
            page: 62
          - code: "2.2.3"
            statement: "Agencies of formal social control and methods used: police, courts, penal system, armed forces, government"
            syllabus_ref: "2.2.3"
            page: 64
          - code: "2.2.4"
            statement: "Agencies of informal social control and methods used: family, education, peer group, religion, workplace, media"
            syllabus_ref: "2.2.4"
            page: 67
          - code: "2.2.5"
            statement: "Resistance to social control: protest groups and sub-cultures"
            syllabus_ref: "2.2.5"
            page: 69
      - code: "ch2.3"
        name: "What influences our social identity?"
        objectives:
          - code: "2.3.1"
            statement: "Social identity: age, gender, ethnicity and social class"
            syllabus_ref: "2.3.1"
            page: 71
          - code: "2.3.2"
            statement: "The digital self and online identities"
            syllabus_ref: "2.3.2"
            page: 76
          - code: "2.3.3"
            statement: "Globalisation and its impact on social identity"
            syllabus_ref: "2.3.3"
            page: 80
          - code: "2.3.4"
            statement: "Postmodernist views of identity as chosen and fluid rather than given"
            syllabus_ref: "2.3.4"
            page: 84

  - code: U3
    name: "Social stratification and inequality"
    children:
      - code: "ch3.1"
        name: "What is social stratification?"
        objectives:
          - code: "3.1.1"
            statement: "Social stratification in open and closed societies: ascribed vs achieved status, social mobility"
            syllabus_ref: "3.1.1"
            page: 91
          - code: "3.1.2"
            statement: "Differences in life chances affected by age, gender, ethnicity and social class"
            syllabus_ref: "3.1.2"
            page: 95
          - code: "3.1.3"
            statement: "The intersectionality of age, ethnicity, gender and social class in understanding inequality"
            syllabus_ref: "3.1.3"
            page: 102
          - code: "3.1.4"
            statement: "Different sociological theories on social inequality: Functionalist, Marxist, Weberian, Feminist"
            syllabus_ref: "3.1.4"
            page: 106
      - code: "ch3.2"
        name: "What attempts have been made to reduce social inequalities?"
        objectives:
          - code: "3.2.1"
            statement: "The use of legislation within societies to reduce inequality: equal pay, sex discrimination, race relations, disability acts"
            syllabus_ref: "3.2.1"
            page: 113
          - code: "3.2.2"
            statement: "The development and impact of welfare states on life chances: healthcare, education, social security, progressive taxation"
            syllabus_ref: "3.2.2"
            page: 116
          - code: "3.2.3"
            statement: "The global work of Non-Governmental Organisations (NGOs) to reduce inequalities: poverty relief, education, human rights"
            syllabus_ref: "3.2.3"
            page: 119
          - code: "3.2.4"
            statement: "Sociological views of the success of attempts to reduce social inequalities"
            syllabus_ref: "3.2.4"
            page: 121
      - code: "ch3.3"
        name: "How has globalisation affected inequalities between societies?"
        objectives:
          - code: "3.3.1"
            statement: "The impact of migration on societies: economic, demographic, cultural effects and life chances"
            syllabus_ref: "3.3.1"
            page: 123
          - code: "3.3.2"
            statement: "The impact of global ecological issues on societies: environmental degradation, resource depletion, climate justice"
            syllabus_ref: "3.3.2"
            page: 127
          - code: "3.3.3"
            statement: "Sociological explanations for global inequalities: modernisation theory, dependency theory, colonialism and neo-colonialism"
            syllabus_ref: "3.3.3"
            page: 130

  - code: U4
    name: "Family"
    children:
      - code: "ch4.1"
        name: "What are the different types of families?"
        objectives:
          - code: "4.1.1"
            statement: "Different family structures: nuclear, extended, single-parent, reconstituted, same-sex, beanpole"
            syllabus_ref: "4.1.1"
            page: 137
          - code: "4.1.2"
            statement: "Variations and diversity in the family: cultural, ethnic, social class, regional"
            syllabus_ref: "4.1.2"
            page: 140
          - code: "4.1.3"
            statement: "Sociological views on family diversity: Functionalism, New Right, Feminism, Postmodernism"
            syllabus_ref: "4.1.3"
            page: 142
          - code: "4.1.4"
            statement: "Alternatives to the family: communes, kibbutzim, residential care, single-person households"
            syllabus_ref: "4.1.4"
            page: 144
          - code: "4.1.5"
            statement: "Variations in types of marriage: monogamy, serial monogamy, polygamy, polygyny, polyandry, arranged and forced marriages"
            syllabus_ref: "4.1.5"
            page: 145
      - code: "ch4.2"
        name: "What is the role of the family for the individual and society?"
        objectives:
          - code: "4.2.1"
            statement: "Functionalist views: primary socialisation, stabilisation of adult personalities (Parsons, Murdock)"
            syllabus_ref: "4.2.1"
            page: 148
          - code: "4.2.2"
            statement: "Marxist views: reproduction of labour power, unit of consumption, ideological conditioning"
            syllabus_ref: "4.2.2"
            page: 151
          - code: "4.2.3"
            statement: "Feminist views: patriarchal control, domestic division of labour, triple shift, emotional labour"
            syllabus_ref: "4.2.3"
            page: 153
          - code: "4.2.4"
            statement: "Strengths and limitations of functionalist, Marxist and feminist views of the role of the family"
            syllabus_ref: "4.2.4"
            page: 155
          - code: "4.2.5"
            statement: "Debates about whether the experience of family life is positive or negative: domestic abuse, child neglect, dark side of the family"
            syllabus_ref: "4.2.5"
            page: 156
      - code: "ch4.3"
        name: "How is family life changing?"
        objectives:
          - code: "4.3.1"
            statement: "Demographic factors and their effects on family life: birth rates, fertility rates, death rates, ageing population"
            syllabus_ref: "4.3.1"
            page: 158
          - code: "4.3.2"
            statement: "The impact of industrialisation and urbanisation on family structures and roles"
            syllabus_ref: "4.3.2"
            page: 161
          - code: "4.3.3"
            statement: "Explanations of changing patterns and trends in marriage, divorce and cohabitation"
            syllabus_ref: "4.3.3"
            page: 163
          - code: "4.3.4"
            statement: "Alternatives to marriage: civil partnerships, cohabitation, living apart together (LAT)"
            syllabus_ref: "4.3.4"
            page: 166
          - code: "4.3.5"
            statement: "Changing family roles: joint and segregated conjugal roles, symmetrical family, dual-earner families, new man"
            syllabus_ref: "4.3.5"
            page: 167

  - code: U5
    name: "Education"
    children:
      - code: "ch5.1"
        name: "What is education and schooling?"
        objectives:
          - code: "5.1.1"
            statement: "Formal and informal education: official curriculum and the hidden curriculum"
            syllabus_ref: "5.1.1"
            page: 176
          - code: "5.1.2"
            statement: "Different types of schools: state, private/independent, selective, comprehensive, faith, academies, international"
            syllabus_ref: "5.1.2"
            page: 179
          - code: "5.1.3"
            statement: "Alternative approaches to education: home schooling, democratic schools, deschooling (Illich)"
            syllabus_ref: "5.1.3"
            page: 186
      - code: "ch5.2"
        name: "What are the roles and functions of education?"
        objectives:
          - code: "5.2.1"
            statement: "The functionalist view: secondary socialisation, social solidarity, skills provision, role allocation and meritocracy (Durkheim, Parsons, Davis & Moore)"
            syllabus_ref: "5.2.1"
            page: 189
          - code: "5.2.2"
            statement: "The Marxist view: reproduction of class inequality, correspondence principle, myth of meritocracy, cultural capital (Bowles & Gintis, Bourdieu)"
            syllabus_ref: "5.2.2"
            page: 192
          - code: "5.2.3"
            statement: "The feminist view: patriarchal culture, gendered curriculum, teacher expectations, glass ceiling, hidden curriculum"
            syllabus_ref: "5.2.3"
            page: 195
      - code: "ch5.3"
        name: "What factors help to explain differences in educational achievement and experience?"
        objectives:
          - code: "5.3.1"
            statement: "Patterns in educational achievement and experience: social class, ethnicity, gender, global differences"
            syllabus_ref: "5.3.1"
            page: 198
          - code: "5.3.2"
            statement: "Explanations based on social class: material deprivation, cultural capital, linguistic codes, labelling, setting/streaming, subcultures"
            syllabus_ref: "5.3.2"
            page: 199
          - code: "5.3.3"
            statement: "Explanations based on ethnicity: institutional racism, ethnocentric curriculum, teacher stereotyping, language, subcultures"
            syllabus_ref: "5.3.3"
            page: 205
          - code: "5.3.4"
            statement: "Explanations based on gender: feminisation of education, laddish subcultures, changing aspirations, bedroom culture"
            syllabus_ref: "5.3.4"
            page: 208
          - code: "5.3.5"
            statement: "Global differences in educational achievement and experience: poverty, access for girls, infrastructure, teacher training"
            syllabus_ref: "5.3.5"
            page: 212
          - code: "5.3.6"
            statement: "Strengths and limitations of explanations for differences in educational achievement"
            syllabus_ref: "5.3.6"
            page: 214

  - code: U6
    name: "Crime, deviance and social control"
    children:
      - code: "ch6.1"
        name: "What are crime, deviance and social control?"
        objectives:
          - code: "6.1.1"
            statement: "The difference between crime and deviance: definitions and cultural/historical relativity"
            syllabus_ref: "6.1.1"
            page: 219
          - code: "6.1.2"
            statement: "Formal social control: police, courts, armed forces, penal system, preventive and custodial measures"
            syllabus_ref: "6.1.2"
            page: 221
          - code: "6.1.3"
            statement: "Informal social control: family, education, workplace, peer group, media, religion"
            syllabus_ref: "6.1.3"
            page: 223
          - code: "6.1.4"
            statement: "Effectiveness of agencies and methods of social control in achieving conformity and preventing crime"
            syllabus_ref: "6.1.4"
            page: 224
          - code: "6.1.5"
            statement: "Different types of crime: violent, property, white-collar/corporate, cyber, hate, green, global/organised, expressive vs instrumental"
            syllabus_ref: "6.1.5"
            page: 225
          - code: "6.1.6"
            statement: "Measuring crime: official statistics, self-report studies, victim surveys, dark figure of unreported crime"
            syllabus_ref: "6.1.6"
            page: 230
      - code: "ch6.2"
        name: "What are the patterns of and explanations for crime and deviance?"
        objectives:
          - code: "6.2.1"
            statement: "Patterns of crime and victimisation: age, social class, gender, ethnicity"
            syllabus_ref: "6.2.1"
            page: 234
          - code: "6.2.2"
            statement: "Explanations based on age: peer group pressure, status frustration, lack of opportunity, focal concerns, stop and search"
            syllabus_ref: "6.2.2"
            page: 236
          - code: "6.2.3"
            statement: "Explanations based on ethnicity: institutional racism, stereotyping, material deprivation, status frustration, target hardening"
            syllabus_ref: "6.2.3"
            page: 239
          - code: "6.2.4"
            statement: "Explanations based on gender: chivalry thesis, socialization, patriarchal control, ladette culture, sex role theory"
            syllabus_ref: "6.2.4"
            page: 241
          - code: "6.2.5"
            statement: "Explanations based on social class: material deprivation, strain theory, subcultural adaptations, selective law enforcement"
            syllabus_ref: "6.2.5"
            page: 243
          - code: "6.2.6"
            statement: "Sociological theories on crime: Functionalism (strain, subcultures), Interactionism (labelling, self-fulfilling prophecy, moral panics), Marxism, Feminism"
            syllabus_ref: "6.2.6"
            page: 245
          - code: "6.2.7"
            statement: "Strengths and limitations of different explanations for crime and deviance"
            syllabus_ref: "6.2.7"
            page: 251
      - code: "ch6.3"
        name: "How is crime dealt with in different societies?"
        objectives:
          - code: "6.3.1"
            statement: "Aims of punishment: protection of citizens, deterrence, retribution, incapacitation, rehabilitation"
            syllabus_ref: "6.3.1"
            page: 255
          - code: "6.3.2"
            statement: "Effectiveness of different types of punishment: prison, community sentencing, financial penalties, restorative justice, capital punishment, electronic tagging, probation"
            syllabus_ref: "6.3.2"
            page: 257
          - code: "6.3.3"
            statement: "The effectiveness of policing and law enforcement: zero tolerance, community policing, digital surveillance, crime prevention strategies"
            syllabus_ref: "6.3.3"
            page: 259
