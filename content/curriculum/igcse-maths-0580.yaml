# Curriculum structure — Cambridge IGCSE Mathematics 0580 (Extended)
#
# Provenance:
# - Content areas 1–4 names: school Term 1 planner (Sep–Dec 2026).
# - Chapters and sections (with Extended markers and printed page numbers): contents pages of the
#   Collins Cambridge IGCSE Maths Student's Book, 4th edition (written for 0580 from 2020).
# - Verified 15 Sep 2026 against the official Cambridge IGCSE Mathematics 0580 syllabus for 2028–2030
#   (subjects/mathematics): the nine content areas are the syllabus topics E1–E9 (Number; Algebra and graphs;
#   Coordinate geometry; Geometry; Mensuration; Trigonometry; Transformations and vectors; Probability;
#   Statistics) and the components below come from its assessment overview. The 2025–2027 syllabus has the same
#   paper structure, so papers from June 2025 on match the 2028 format; earlier papers are practice only.
#   Textbook sections are mapped to content areas by chapter; the subtopic-level mapping (E1.1…) is not stored.
# tier: extended = "E" in the textbook (Extended only); all = required for Core and Extended.
# page: printed textbook page where the section starts (used to tag retrieval chunks).

curriculum: { code: CAIE-IGCSE, name: Cambridge IGCSE }
path: { code: IGCSE, name: IGCSE }
syllabus:
  code: "0580"
  title: Cambridge IGCSE Mathematics
  version: "for-2028-exam"
  tiers: [core, extended]
  verification_status: verified
  source_note: >-
    Content areas and component structure verified against the official 0580 syllabus for 2028–2030 (exam
    session 2028-06). Chapter/section structure from the Collins 4th edition contents.
subject: { code: igcse-maths, name: Mathematics, config_key: igcse_maths_0580 }

components:
  - code: "P2"
    name: Paper 2 — Non-calculator (Extended)
    tier: extended
    duration_min: 120
    marks: 100
    calculator_allowed: false
    structure_note: Structured and unstructured questions; 50% of the qualification.
  - code: "P4"
    name: Paper 4 — Calculator (Extended)
    tier: extended
    duration_min: 120
    marks: 100
    calculator_allowed: true
    structure_note: Structured and unstructured questions; scientific calculator required; 50% of the qualification.

skills:
  - { code: AO1, name: Knowledge and understanding of mathematical techniques }
  - { code: AO2, name: Analyse, interpret and communicate mathematically }

topics:
