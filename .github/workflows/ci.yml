name: ci

# Lint + unit tests (no database, no LLM calls, no copyrighted material; includes the AC-A2/AC-S5 architecture rules
# and eval dataset checks), database integration tests against Postgres 16 + pgvector, and the web build.
# The evals themselves make LLM calls and run locally after a cost estimate (CLAUDE.md).
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check app tests migrations
      - run: uv run ruff check app tests migrations
      - run: uv run pytest tests/unit -q

  api-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scholr
          POSTGRES_PASSWORD: scholr_dev_password
          POSTGRES_DB: scholr
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scholr -d scholr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # CI-only throwaway credentials, same shape as apps/api/.env.example. No LLM key: tests use scripted transports.
      PGPASSWORD: scholr_dev_password
      APP_ENV: test
      AUTH_MODE: dev
      AUTH_DEV_SECRET: ci-only-dev-secret-not-used-anywhere-else
      DATABASE_URL: postgresql+psycopg://scholr_app:scholr_app_dev_password@localhost:5433/scholr
      MIGRATION_DATABASE_URL: postgresql+psycopg://scholr:scholr_dev_password@localhost:5433/scholr
      TEST_DATABASE_URL: postgresql+psycopg://scholr_app:scholr_app_dev_password@localhost:5433/scholr_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://scholr:scholr_dev_password@localhost:5433/scholr_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Create the test database and application role (the docker compose init scripts)
        run: |
          psql -h localhost -p 5433 -U scholr -d scholr -v ON_ERROR_STOP=1 -f ../../infra/db-init/01-extensions-and-test-db.sql
          psql -h localhost -p 5433 -U scholr -d scholr -v ON_ERROR_STOP=1 -f ../../infra/db-init/02-app-role.sql
      - name: Integration tests (fail if they skip for want of a database)
        run: |
          uv run pytest tests/integration -q -rs | tee pytest.out
          ! grep -q "SKIPPED" pytest.out

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
