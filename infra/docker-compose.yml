name: scholr

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scholr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholr
      POSTGRES_PASSWORD: ${SCHOLR_DB_PASSWORD:-scholr_dev_password}
      POSTGRES_DB: scholr
    ports:
      - "5433:5432"
    volumes:
      - scholr-db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholr -d scholr"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: scholr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - scholr-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scholr-db-data:
  scholr-redis-data:

