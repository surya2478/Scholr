[project]
name = "scholr-api"
version = "0.1.0"
description = "Scholr — personal AI learning OS (API modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "sympy>=1.13",
  "pyyaml>=6.0",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "tzdata>=2026.4",
  "arq>=0.26.1",
  "redis>=5.0.8",
  "pint>=0.26.1",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "db: needs a running PostgreSQL (docker compose -f infra/docker-compose.yml up -d)",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
